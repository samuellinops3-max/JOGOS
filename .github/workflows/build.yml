name: Build PS3 PKG
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: psl1ght/psl1ght:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make
          make_package_npdrm --content-id UP0001-COBRA00001_00-COBRAARENA000001 --k-licensee 0x00000000000000000000000000000000 cobra_arena.self cobra_arena.pkg || true
          ls -lh
      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: cobra_arena-pkg
          path: "*.pkg"
      - name: Upload SELF
        uses: actions/upload-artifact@v4
        with:
          name: cobra_arena-self
          path: "*.self"